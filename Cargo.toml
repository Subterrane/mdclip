[package]
name = "mdclip"
version = "0.1.0"
edition = "2024"
description = "Convert Markdown to rich text on the macOS clipboard"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
